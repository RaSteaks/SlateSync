appId: com.slatesync.app
productName: SlateSync
copyright: Copyright © 2026
npmRebuild: true

publish:
  provider: github
  owner: RaSteaks
  repo: SlateSync
  releaseType: release

directories:
  output: dist
  buildResources: build

# The current Electron transition target is macOS only. Both supported slices
# stay declared here so local packages remain reproducible across Apple hosts.
mac:
  category: public.app-category.productivity
  # Keep the transition package aligned with the native app's platform floor.
  minimumSystemVersion: "15.0"
  # Use the layered Icon Composer asset for macOS and keep the PNG as a fallback.
  icon: build/slatesync.icon
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Vision OCR is a macOS binary and belongs inside every macOS package.
  extraResources:
    - from: bin/
      to: app/bin/

dmg:
  title: SlateSync
  window:
    width: 540
    height: 380

files:
  - electron/**/*
  - lib/**/*
  - public/**/*
  - package.json
  - out/**/*

extraResources:
  - from: scripts/
    to: app/scripts/
  - from: requirements-ocr.txt
    to: app/requirements-ocr.txt
  - from: slatesync.config.json
    to: app/slatesync.config.json

asarUnpack:
  - scripts/**/*
  - bin/**/*
  - node_modules/better-sqlite3/build/Release/**/*
