appId: com.slatesync.app
productName: SlateSync
copyright: Copyright © 2026
npmRebuild: true

publish:
  provider: github
  owner: RaSteaks
  repo: SlateSync
  releaseType: release

directories:
  output: dist
  buildResources: build

# Local source builds select the host platform explicitly. macOS release builds
# retain both supported architectures; Windows builds are intentionally x64-only.
mac:
  category: public.app-category.productivity
  # electron-builder requires the layered container; its embedded artwork is
  # the canonical assets/slatesync-icon-v5.png raster.
  icon: build/slatesync.icon
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Vision OCR is a macOS binary and must not be copied into Windows packages.
  extraResources:
    - from: bin/
      to: app/bin/

win:
  target:
    - target: nsis
      arch: [x64]

dmg:
  title: SlateSync
  window:
    width: 540
    height: 380

files:
  - electron/**/*
  - lib/**/*
  - public/**/*
  - package.json
  - out/**/*

extraResources:
  - from: scripts/
    to: app/scripts/
  - from: requirements-ocr.txt
    to: app/requirements-ocr.txt
  - from: slatesync.config.json
    to: app/slatesync.config.json

asarUnpack:
  - scripts/**/*
  - bin/**/*
  - node_modules/better-sqlite3/build/Release/**/*
