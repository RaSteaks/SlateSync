name: CSV performance diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csv-profile:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated CSV test
        run: swift test --configuration release --filter testForegroundCSVMeetsDisplayCadenceBudget
      - name: Measure and sample CSV scrolling
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/csv-profile"
          any_failed=0
          for round in 1 2 3; do
            SLATESYNC_SM08_FOREGROUND_GATE=1 SLATESYNC_SM08_METRICS_DIR="$RUNNER_TEMP/csv-profile/round-$round" swift test --skip-build --configuration release --filter testForegroundCSVMeetsDisplayCadenceBudget > "$RUNNER_TEMP/csv-profile/round-$round.log" 2>&1 &
            csv_test_pid=$!
            csv_pid=""
            for attempt in {1..40}; do
              csv_pid=$(pgrep -f '/SlateSyncPackageTests[.]xctest' | head -n 1) || true
              if [ -n "$csv_pid" ]; then break; fi
              sleep 0.1
            done
            if [ -n "$csv_pid" ]; then
              sleep 2
              sample "$csv_pid" 3 1 -file "$RUNNER_TEMP/csv-profile/round-$round-sample.txt" || true
            fi
            wait "$csv_test_pid" || any_failed=1
          done
          exit "$any_failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csv-profile
          path: ${{ runner.temp }}/csv-profile
