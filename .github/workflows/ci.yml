name: Native macOS CI

on:
  push:
    branches: [swift-rewrite]
  pull_request:
    branches: [swift-rewrite]
  workflow_dispatch:
    inputs:
      profile:
        description: Validation to run
        type: choice
        required: true
        default: quick
        options:
          - quick
          - csv-ui
          - sm09
          - performance

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  native-test:
    # Keep this check name stable for existing branch protection rules.
    name: Swift, Xcode and local package validation
    if: github.event_name != 'workflow_dispatch' || inputs.profile == 'quick'
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: native-quick-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The offline preflight verifies historical migration fixtures in Git.
          fetch-depth: 0
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version | grep -Fx 'Build version 17C529'
          swift --version
      - name: Install preflight dependency
        run: command -v rg || brew install ripgrep
      - name: Run offline contracts
        run: ./script/ci_preflight.sh
      - name: Build and test the Swift package
        run: swift test -Xswiftc -warnings-as-errors
      - name: Compile the App Store app for the runner architecture
        run: |
          xcodebuild -quiet -project SlateSync.xcodeproj -scheme SlateSync \
            -configuration AppStore -destination 'platform=macOS' \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

  csv-ui:
    name: Workspace CSV and source review regressions (Debug)
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'csv-ui'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy CSV delivery and new-source review selection
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/csv-ui"
          xcodebuild -project SlateSync.xcodeproj -scheme SlateSync -testPlan SlateSync \
            -configuration Debug -destination 'platform=macOS' CODE_SIGN_IDENTITY=- \
            -parallel-testing-enabled NO \
            -only-testing:SlateSyncUITests/SlateSyncUITests/testLegacyLibraryCSVExportAndReopenInDeliveredApp \
            -only-testing:SlateSyncUITests/SlateSyncUITests/testPreviewPagingPreservesResultSelection \
            -resultBundlePath "$RUNNER_TEMP/csv-ui/CSV.xcresult" test
          # A stale test selector can produce zero executions; check the actual result.
          xcrun xcresulttool get test-results summary --format json --path "$RUNNER_TEMP/csv-ui/CSV.xcresult" \
            | tee "$RUNNER_TEMP/csv-ui/summary.json" \
            | jq -e '.result == "Passed" and .passedTests == 2 and .failedTests == 0 and .skippedTests == 0'
      - name: Keep the focused XCTest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csv-ui-result
          path: ${{ runner.temp }}/csv-ui/
          retention-days: 7

  functional:
    name: Full functional SM-09 acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'sm09'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Gate toolchain and dependency
        run: |
          xcodebuild -version | grep -Fx 'Build version 17C529'
          command -v rg || brew install ripgrep
      - name: Run required functional SM-09 Gate
        # Policy v2: a clean PASS may support migration completion review.
        # It retains approvable=false/fullAcceptancePassed=false and never
        # approves a release or updates the recorded phase state itself.
        env:
          SLATESYNC_GATE_RESULTS_DIR: ${{ runner.temp }}/SlateSync-Gate
        run: ./script/phase_gate.sh SM-09 --functional

      - name: Verify Debug and packaged UI execution coverage
        run: |
          # Counts can match while different tests run. Require every named
          # Release regression and every Debug Provider fixture to have passed.
          python3 -B script/tests/packaged_ui_contract.py \
            --gate-root "$RUNNER_TEMP/SlateSync-Gate/SM-09"

      - name: Export failed XCTest diagnostics
        if: failure() || cancelled()
        shell: bash
        run: |
          # Preserve raw xcresult bundles too: --only-failures can return no
          # attachments even after the test recorded an AX snapshot/screenshot.
          ./script/export_xctest_diagnostics.sh "$RUNNER_TEMP/SlateSync-Gate/SM-09"

      - name: Upload failure diagnostics
        # Include raw temporary bundles when transfer into Gate evidence failed.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-diagnostics
          path: |
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/result.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/release-identity.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/checks.tsv
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/*.log
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/native-evidence.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/xcode_test_summary.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/xcode_test_plan_tests.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/packaged_ui_summary.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/packaged_ui_tests.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/ui-scope-evidence.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/*.xcresult.zip
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/*.xcresult.summary.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/*.xcresult.tests.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/sm08-metrics/*.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/artifacts/*-manifest.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/artifacts/SHA256SUMS
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/xcresult-failure-attachments/**
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/xcresult-diagnostics/**
            ${{ runner.temp }}/slatesync-xcode-test.*/SlateSync.xcresult/**
            ${{ runner.temp }}/slatesync-package-smoke.*/Packaged.xcresult/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload native Gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-evidence
          path: |
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/SUMMARY.md
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/result.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/release-identity.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/checks.tsv
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/native-evidence.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/xcode_test_summary.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/xcode_test_plan_tests.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/packaged_ui_summary.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/packaged_ui_tests.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/ui-scope-evidence.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/sm08-metrics/*.json
          if-no-files-found: ignore
          retention-days: 14

  # Independent advisory lane: an over-budget benchmark is reported, not merged
  # into the required functional job's result. Its assertions remain strict.
  performance:
    name: Performance report (non-blocking)
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'performance'
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run performance benchmarks
        id: benchmarks
        continue-on-error: true
        run: python3 script/performance_report.py --results-dir "$RUNNER_TEMP/SlateSync-Performance"
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-performance-report
          path: ${{ runner.temp }}/SlateSync-Performance
          if-no-files-found: warn
          retention-days: 14
