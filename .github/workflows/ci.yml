name: CSV performance comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csv-compare:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Compare on the same hosted runner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/csv-compare"
          any_failed=0
          for variant in baseline borderless; do
            if [ "$variant" = borderless ]; then
              python3 -c 'from pathlib import Path; p=Path("Sources/SlateSyncUI/CSV/EditableCSVTableRepresentable.swift"); s=p.read_text(); p.write_text(s.replace("field.isBordered = false", "field.isBordered = false\n                field.isBezeled = false\n                field.maximumNumberOfLines = 1"))'
            fi
            swift test --configuration release --filter testForegroundCSVMeetsDisplayCadenceBudget
            for round in 1 2 3; do
              SLATESYNC_SM08_FOREGROUND_GATE=1 SLATESYNC_SM08_METRICS_DIR="$RUNNER_TEMP/csv-compare/$variant-$round" swift test --skip-build --configuration release --filter testForegroundCSVMeetsDisplayCadenceBudget > "$RUNNER_TEMP/csv-compare/$variant-$round.log" 2>&1 || any_failed=1
            done
          done
          exit "$any_failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csv-compare
          path: ${{ runner.temp }}/csv-compare
