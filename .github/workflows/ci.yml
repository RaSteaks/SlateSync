name: Native macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-test:
    name: Swift, Xcode and local package validation
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    # A full compatibility Gate measured about seven minutes locally. The
    # native path keeps a 30-minute ceiling for cold caches, UI startup, the
    # Universal archive, DMG mount verification, and cleanup (CARRY-02).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned Apple toolchain
        run: |
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Xcode 26.3' "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Build version 17C529' "$RUNNER_TEMP/xcode-version.txt"
          swift --version
          sw_vers

      - name: Run shared native SM-09 Gate
        env:
          SLATESYNC_NATIVE_ONLY: "1"
          SLATESYNC_GATE_RESULTS_DIR: ${{ runner.temp }}/SlateSync-Gate
        run: ./script/phase_gate.sh SM-09

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-diagnostics
          path: |
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/result.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/checks.tsv
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/*.log
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/xcode_test_summary.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/artifacts/*-manifest.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/artifacts/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 7
