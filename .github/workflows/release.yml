name: Build native macOS release candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer matching MARKETING_VERSION
        required: true
      build:
        description: Monotonic CFBundleVersion integer
        required: true

permissions:
  contents: read

jobs:
  local-candidate:
    name: Universal ad-hoc candidate
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    # CI and release share the same native Gate and 60-minute execution bound.
    # The Gate creates one archive, then packages that exact audited app.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Provenance and cutover ancestry must be available on cold runners.
          fetch-depth: 0

      - name: Validate requested version and toolchain
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_BUILD" =~ ^[1-9][0-9]*$ ]]
          # Match this checkout's candidate, not the sealed migration baseline.
          expected_identity="$(python3 -B script/release_identity.py)"
          [[ "$expected_identity" == "$(printf '%s\n%s' "$RELEASE_VERSION" "$RELEASE_BUILD")" ]]
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Xcode 26.3' "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Build version 17C529' "$RUNNER_TEMP/xcode-version.txt"

      - name: Build, audit and package one Universal app
        env:
          SLATESYNC_GATE_RESULTS_DIR: ${{ runner.temp }}/SlateSync-Gate
        run: ./script/phase_gate.sh SM-09

      # Full release acceptance needs the same failure evidence as merge CI.
      - name: Export failed XCTest diagnostics
        if: failure() || cancelled()
        run: ./script/export_xctest_diagnostics.sh "$RUNNER_TEMP/SlateSync-Gate/SM-09"

      - name: Retain Gate evidence
        # Failed evidence transfers retain their raw runner-temporary bundles.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-release-gate-evidence
          path: |
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/*.log
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/*.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/*.tsv
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/*.md
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/*.xcresult.zip
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/xcresult-failure-attachments/**
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/xcresult-diagnostics/**
            ${{ runner.temp }}/slatesync-xcode-test.*/SlateSync.xcresult/**
            ${{ runner.temp }}/slatesync-package-smoke.*/Packaged.xcresult/**
          if-no-files-found: warn
          retention-days: 14

      # WP-0 authorizes local/ad-hoc evidence only. This workflow deliberately
      # has no Developer ID secret, notarization, tag, or GitHub Release write.
      - name: Upload local validation candidates
        uses: actions/upload-artifact@v4
        with:
          name: SlateSync-${{ inputs.version }}-macOS-universal-adhoc
          path: |
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/artifacts/SlateSync-*.zip
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/artifacts/SlateSync-*.dmg
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/artifacts/SHA256SUMS
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/artifacts/SlateSync-*-manifest.json
            ${{ runner.temp }}/SlateSync-Gate/SM-09/*/artifacts/SlateSync-*-release-notes.md
          if-no-files-found: error
          retention-days: 14
