name: Release macOS application

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-14
    # 与 ci.yml 同理：job 内嵌完整 Gate（~15-20 分钟本地实测）加打包与
    # artifact 上传，30 分钟余量不足（CARRY-02）；WP-5 重写 release lane
    # 为单次 Universal 构建后按实测定值。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build local Vision OCR bridge
        run: node scripts/build-vision-ocr.mjs --arch ${{ matrix.arch }}

      # 与 ci.yml 相同的工作阶段语义：上一阶段 COMPLETE 且下一阶段已开工时
      # 跑下一阶段 Gate 的预准入模式，避免实施期提交击穿批准检查。
      - name: Resolve the active migration phase
        id: phase
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          with open(".codex/swift-migration/CURRENT_STATE.json", encoding="utf-8") as handle:
              state = json.load(handle)
          phase = state["phase"]
          number = int(phase.split("-")[1])
          work = f"SM-{number + 1:02d}"
          packages = ".codex/swift-migration/packages"
          reviews = ".codex/swift-migration/reviews"
          if os.path.exists(f"{packages}/{work}.md") and not os.path.exists(f"{reviews}/{work}.md"):
              phase = work
          print(f"phase={phase}")
          PY

      - name: Verify source and tests
        run: |
          ./script/phase_gate.sh "${{ steps.phase.outputs.phase }}"
          npm run check
          npm run typecheck
          npm test
          npm run test:native:abi
          npm run build:modern

      - name: Build macOS artifacts
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slatesync-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: macos-14
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SlateSync $GITHUB_REF_NAME" \
            --generate-notes
